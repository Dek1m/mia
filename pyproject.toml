[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mia"
version = "0.3.0"
description = "State Manager with module system"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Argenta Team"}]
dependencies = [
    "argenta-logging @ git+https://github.com/Dek1m/argenta-logging.git",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "shaltir @ file:../shaltir",
    "cryptography>=42",
]

[project.optional-dependencies]
metrics = ["prometheus-client>=0.20.0"]
db = ["psycopg[binary]>=3.0.0", "psycopg_pool>=3.0.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0", "prometheus-client>=0.20.0"]

[tool.setuptools.packages.find]
include = [
    "core*",
    "modules_system*",
    "monitoring*",
    "resilience*",
    "storage*",
    "communication*",
]
exclude = ["pools*", "tests*", "modules*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
import-mode = "importlib"
markers = []
