[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mia"
version = "0.0.0"
description = "State Manager with module system and multiprocessing dispatching"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Argenta Team"}]
dependencies = ["argenta-logging>=0.1.0"]

[project.optional-dependencies]
metrics = ["prometheus-client>=0.20.0"]
dev = ["pytest>=7.0", "prometheus-client>=0.20.0"]

[tool.setuptools]
py-modules = [
    "core.interfaces", "core.errors", "core.application", "core.factories",
    "core.service_registry", "core.task", "core.task_decorator",
    "modules_system.module_base", "modules_system.module_manager",
    "modules_system.module_registry",
    "pools.thread_pool", "pools.cpu_affinity",
    "pools.cpu_metrics", "pools.load_balancer", "pools.worker_manager",
    "monitoring.heartbeat_monitor", "monitoring.health_check",
    "monitoring.metrics",
    "resilience.retry", "resilience.circuit_breaker",
    "resilience.shutdown_manager",
    "storage.shared_memory", "storage.serializer", "storage.cache_interface", "storage.logging_config",
    "communication.event_bus", "communication.api_proxy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
