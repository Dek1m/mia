# Belle Unified Configuration
# Каскад: belle.toml → ENV BELLE_*/AUTH_*/DB_* overrides

[app]
service_name = "belle"
modules_dir = "modules"
verification_mode = "disabled"

[auth]
jwt_secret = ""
jwt_algorithm = "HS256"
access_token_ttl = 900
refresh_token_ttl = 2592000
password_min_length = 8
password_require_uppercase = true
password_require_digit = true
password_history_size = 10
login_attempts_limit = 5
login_block_minutes = 15
perms_cache_ttl = 300

[auth.cache]
get_user_ttl = 300
check_permission_ttl = 60

[auth.timeouts]
login = 10.0
create_user = 5.0

[db]
host = "localhost"
port = 5432
database = "belle"
user = "svc_athene_ai"
pool_min = 2
pool_max = 10

[llm]
default_provider = "openai"
timeout = 120.0

[apiproxy]
whitelist = ["auth", "workspace", "llm"]
method_timeout = 30.0

[workspace]
default_page_size = 50
max_page_size = 200

[log]
level = "INFO"
format = "posix"

[core.task]
timeout = 10.0
retry = 0

[pools.worker]
count = "auto"
cpu_affinity = true

[shared_memory]
backend = "local"
result_ttl = 300
