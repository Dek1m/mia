services:
  mia:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: mia
    restart: unless-stopped
    environment:
      - MIA_DB_HOST=postgres
      - MIA_DB_PORT=5432
      - MIA_DB_NAME=mia
      - MIA_DB_USER=mia
      - MIA_DB_PASSWORD=${MIA_DB_PASSWORD:-changeme}
      - MIA_LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from core.application import Application"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: mia-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mia
      - POSTGRES_USER=mia
      - POSTGRES_PASSWORD=${MIA_DB_PASSWORD:-changeme}
    volumes:
      - mia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mia"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mia-pgdata:
